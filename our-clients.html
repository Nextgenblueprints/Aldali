<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Clients | Al Dali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #333;
      font-family: 'Open Sans', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .page-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 70px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .brand img {
      height: 40px;
      width: auto;
    }

    .brand-text {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .brand-logo {
      font-size: 28px;
      font-weight: 700;
      color: #c8a84b;
      letter-spacing: -1px;
    }

    .brand-logo span {
      color: #1a1a2e;
    }

    .page-nav {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .page-nav a {
      text-decoration: none;
      color: #555;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 12px;
      transition: color 0.2s;
    }

    .page-nav a:hover { color: #c8a84b; }
    .page-nav a.active { color: #c8a84b; }

    /* ── PAGE BANNER ── */
    .page-banner {
      margin-top: 70px;
      padding: 40px 40px 30px;
      background: #f7f7f7;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-banner h1 {
      font-family: 'Roboto', sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: #222;
      margin-bottom: 4px;
    }

    .page-banner p {
      font-size: 13px;
      color: #888;
    }

    .breadcrumb {
      font-size: 12px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumb a { color: #999; text-decoration: none; }
    .breadcrumb a:hover { color: #c8a84b; }
    .breadcrumb .sep { color: #ccc; }
    .breadcrumb .current { color: #c8a84b; }

    /* ── MAIN ── */
    .page-content {
      max-width: 960px;
      margin: 0 auto;
      padding: 60px 40px 100px;
    }

    .clients-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #c8a84b;
      margin-bottom: 6px;
      display: block;
      font-weight: 600;
    }

    .clients-heading {
      font-family: 'Roboto', sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: #222;
      margin-bottom: 40px;
    }

    /* ── LOGO GRID ── */
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid #e0e0e0;
    }

    .logo-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      min-height: 110px;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      transition: background 0.2s;
    }

    .logo-cell:nth-child(3n) { border-right: none; }
    .logo-cell:nth-last-child(-n+3) { border-bottom: none; }

    .logo-cell:not(.empty):hover { background: #fafafa; }
    .logo-cell.empty { pointer-events: none; }

    .logo-cell img {
      max-width: 150px;
      max-height: 60px;
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .logo-cell:hover img { opacity: 1; }

    /* ── FOOTER ── */
    .page-footer {
      background: #1a1a2e;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-footer span {
      font-size: 12px;
      color: #888;
    }

    @media (max-width: 768px) {
      .page-header { padding: 0 16px; }
      .page-nav { gap: 2px; }
      .page-nav a { font-size: 10px; padding: 4px 6px; }
      .page-banner { padding: 28px 16px; flex-direction: column; gap: 12px; align-items: flex-start; }
      .page-content { padding: 40px 16px 72px; }
      .logo-grid { grid-template-columns: repeat(2, 1fr); }
      .page-footer { padding: 16px; flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="page-header">
    <a class="brand-text" href="index.html">
      <div class="brand-logo">&#10147;<span>DIC</span></div>
    </a>
    <nav class="page-nav">
      <a href="index.html">Home</a>
      <a href="about-us.html">About Us</a>
      <a href="our-services.html">Services</a>
      <a href="our-partners.html">Our Partners</a>
      <a href="our-clients.html" class="active">Our Clients</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <!-- PAGE BANNER -->
  <div class="page-banner">
    <div>
      <h1>Our Clients</h1>
      <p>We are here to answer any question you may have.</p>
    </div>
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="sep">›</span>
      <span class="current">Our Clients</span>
    </div>
  </div>

  <!-- MAIN -->
  <main class="page-content">
    <span class="clients-label">Some of Our Recent Clients</span>
    <h2 class="clients-heading">Serving Over 100 Clients and Counting</h2>

    <div class="logo-grid">
      <div class="logo-cell"><img src="KNPC.PNG" alt="KNPC" /></div>
      <div class="logo-cell"><img src="koc1.png" alt="KOC" /></div>
      <div class="logo-cell"><img src="ministrymain.png" alt="MEW" /></div>
      <div class="logo-cell"><img src="kharafinational.png" alt="Kharafi National" /></div>
      <div class="logo-cell"><img src="LIPIC.PNG" alt="KIPIC" /></div>
      <div class="logo-cell"><img src="CHEVRON.PNG" alt="Joint Operations" /></div>
      <div class="logo-cell"><img src="samsungc.png" alt="Samsung C&T" /></div>
      <div class="logo-cell"><img src="sxhlumberger.png" alt="Schlumberger" /></div>
      <div class="logo-cell"><img src="larsenandtourbo.png" alt="Larsen &amp; Toubro" /></div>
      <div class="logo-cell"><img src="hyndaiengiand.png" alt="Hyundai" /></div>
      <div class="logo-cell empty"></div>
      <div class="logo-cell empty"></div>
    </div>
  </main>

  <footer class="page-footer">
    <span>© Al Dali International · Kuwait</span>
    <span>All Rights Reserved 2024</span>
  </footer>

</body>
</html>
